<div class="account-menu">
  <button type="button" class="avatar-btn" (click)="toggle()" aria-label="Mon espace">
    {{ userInitial }}
  </button>

  @if (open()) {
    <div class="account-dropdown">
      <a routerLink="/mon-espace" (click)="close()">Mon espace</a>
      @if (authService.hasRole('ROLE_ADMIN')) {
        <a routerLink="/admin" (click)="close()">Administration</a>
      }

      <div class="dropdown-lang">
        <app-language-switcher />
      </div>

      <button type="button" (click)="logout()">{{ 'nav.logout' | translate }}</button>
    </div>
  }
</div>
