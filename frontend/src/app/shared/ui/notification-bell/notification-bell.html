<div class="notification-bell">
  <button type="button" class="bell-btn" (click)="toggle()" aria-label="Notifications">
    🔔
    @if (unreadCount() > 0) {
      <span class="badge">{{ unreadCount() }}</span>
    }
  </button>

  @if (open()) {
    <div class="dropdown">
      <div class="dropdown-header">
        <span>Notifications</span>
        <button type="button" class="mark-all" (click)="markAllAsRead()">Tout marquer comme lu</button>
      </div>
      @if (notifications().length === 0) {
        <p class="empty">Aucune notification pour le moment.</p>
      } @else {
        <ul class="list">
          @for (n of notifications(); track n.id) {
            <li class="item" [class.unread]="!n.readAt">
              <strong>{{ n.title }}</strong>
              <p>{{ n.message }}</p>
            </li>
          }
        </ul>
      }
    </div>
  }
</div>
