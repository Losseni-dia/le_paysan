<div class="backoffice-layout" [class.collapsed]="collapsed()">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="/logo_paysan.jpg" alt="Le Paysan" class="sidebar-logo-img" />
      <span>Le Paysan</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/livreur/demandes" routerLinkActive="active">Demandes</a>
      <a routerLink="/livreur/livraisons" routerLinkActive="active">Mes livraisons</a>
      <a routerLink="/livreur/historique" routerLinkActive="active">Historique</a>
      <a routerLink="/livreur/parametres" routerLinkActive="active">Paramètres</a>
    </nav>

    <button type="button" class="collapse-btn" (click)="toggleSidebar()">
      {{ collapsed() ? '➡' : '⬅' }}
    </button>
  </aside>

  <div class="backoffice-main">
    <header class="topbar">
      <span class="catalogue-link">Espace livreur</span>
      <div class="topbar-actions">
        @if (available() !== null) {
          <div class="availability-toggle">
            @if (availabilityConfirmed()) {
              <span class="availability-confirmed">Disponibilité mise à jour</span>
            }
            <label class="switch">
              <input
                type="checkbox"
                [checked]="available()"
                [disabled]="updatingAvailability()"
                (change)="toggleAvailability()"
              />
              <span class="switch-track"></span>
            </label>
            <span class="availability-label">{{ available() ? 'Disponible' : 'Indisponible' }}</span>
          </div>
        }
        <app-notification-bell />
        <app-account-menu />
      </div>
    </header>

    <main class="backoffice-content">
      <router-outlet />
    </main>
  </div>
</div>
