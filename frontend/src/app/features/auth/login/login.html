<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Connexion</h1>

    @if (serverError()) {
      <p class="form-error-banner">{{ serverError() }}</p>
    }

    <div class="form-field">
      <label class="form-label" for="username">Identifiant</label>
      <input id="username" class="form-input" type="text" formControlName="username" autocomplete="username" />
      <app-field-error [control]="form.controls.username" />
    </div>

    <div class="form-field">
      <label class="form-label" for="password">Mot de passe</label>
      <div class="password-input-wrapper">
        <input
          id="password"
          class="form-input"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="password-toggle"
          (click)="toggleShowPassword()"
          [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
        >
          {{ showPassword() ? '🙈' : '👁️' }}
        </button>
      </div>
      <app-field-error [control]="form.controls.password" />
    </div>

    <button type="submit" class="btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Connexion...' : 'Se connecter' }}
    </button>

    <div class="auth-links">
      <a routerLink="/mot-de-passe-oublie">Mot de passe oublié ?</a>
      <a routerLink="/inscription">Créer un compte</a>
      <a routerLink="/inscription-livreur">Devenir livreur</a>
    </div>
  </form>
</div>
