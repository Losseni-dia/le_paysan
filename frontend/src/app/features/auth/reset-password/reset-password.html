<div class="auth-page">
  <div class="auth-card">
    <h1>Nouveau mot de passe</h1>

    @if (done()) {
      <p class="form-success-banner">Mot de passe mis à jour. Redirection vers la connexion...</p>
    } @else {
      @if (serverError()) {
        <p class="form-error-banner">{{ serverError() }}</p>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="form-field">
          <label class="form-label" for="newPassword">Nouveau mot de passe</label>
          <input
            id="newPassword"
            class="form-input"
            type="password"
            formControlName="newPassword"
            autocomplete="new-password"
          />
          <app-field-error [control]="form.controls.newPassword" [messages]="passwordMessages" />
        </div>

        <button type="submit" class="btn-primary" [disabled]="submitting()">
          {{ submitting() ? 'Mise à jour...' : 'Mettre à jour' }}
        </button>

        <div class="auth-links">
          <a routerLink="/connexion">Retour à la connexion</a>
        </div>
      </form>
    }
  </div>
</div>
