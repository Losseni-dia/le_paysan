spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:le_paysan}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      # Schema gere manuellement via docs/sql/schema.sql (pas d'auto-generation).
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:losdiakite@gmail.com}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  fedapay:
    api-key: ${FEDAPAY_API_KEY:}
    environment: sandbox
    base-url: https://sandbox-api.fedapay.com/v1
    webhook-secret: ${FEDAPAY_WEBHOOK_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  uploads:
    base-dir: ${UPLOADS_BASE_DIR:./uploads}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

logging:
  level:
    shop.le_paysan.backend: DEBUG
